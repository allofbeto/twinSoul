development:
  adapter: async

test:
  adapter: test

# Production uses Redis when REDIS_URL is set (needed for more than one server process),
# otherwise the in-process async adapter — fine for a single instance, no Redis required.
production:
<% if ENV["REDIS_URL"].present? %>
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: backend_production
<% else %>
  adapter: async
<% end %>
